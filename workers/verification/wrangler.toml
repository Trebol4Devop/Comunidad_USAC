name = "comunidad-usac-verification"
main = "src/index.ts"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "VERIFICATION_BUCKET"
bucket_name = "comunidad-usac-verification"

[triggers]
crons = ["0 */6 * * *"]

[vars]
MAX_FILE_BYTES = "10485760"
ALLOWED_ORIGINS = "*"
